<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LiveMD</title>
    <!-- No CSS framework: static/style.css is the whole design (see design.md).
         devicon supplies the per-language file icons in the tree. -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/devicon.min.css">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <aside class="sidebar">
        <div class="sidebar-header">
            <span class="logo">LiveMD</span>
            <div class="header-right">
                <button class="icon-btn" id="sidebar-hide-btn" title="Hide sidebar (Ctrl+B)" aria-label="Hide sidebar">
                    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><line x1="9" y1="4" x2="9" y2="20"/><polyline points="16 10 14 12 16 14"/></svg>
                </button>
                <a href="https://github.com/erkantaylan/livemd" target="_blank" class="github-link" title="GitHub">
                    <svg width="18" height="18" viewBox="0 0 16 16" fill="currentColor"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>
                </a>
                <span class="tag" id="status">connecting…</span>
            </div>
        </div>
        <div class="sidebar-tabs">
            <ul>
                <li class="is-active" data-tab="files"><a>Files</a></li>
                <li data-tab="inbox"><a title="Files dropped into the inbox folder">Inbox<span class="tab-count is-hidden" id="inbox-count"></span></a></li>
                <li data-tab="logs"><a>Logs</a></li>
                <li data-tab="changelog"><a>Changelog</a></li>
            </ul>
        </div>
        <div class="tab-content" id="files-tab">
            <div class="add-path-bar">
                <input class="input" id="add-path-input" placeholder="Paste a file or folder path" spellcheck="false" title="A file is tracked; a folder is followed, with everything in it">
                <button class="button" id="add-path-btn" title="Track this path">Add</button>
            </div>
            <div class="add-path-error is-hidden" id="add-path-error"></div>
            <div id="deleted-bar" class="deleted-bar is-hidden">
                <button class="button is-danger" id="remove-deleted-btn">Remove all deleted</button>
            </div>
            <div class="filter-bar" id="filter-bar">
                <input class="input" id="filter-input" placeholder="Filter files   /" spellcheck="false" autocomplete="off" title="Filter by name or path — ↑↓ to move, Enter to open, Esc to clear">
                <span class="filter-count" id="filter-count"></span>
            </div>
            <div class="view-options">
                <label class="view-option" title="Hide files git ignores; folders followed with this off also pick them up"><input type="checkbox" id="opt-gitignore" checked> Respect .gitignore</label>
                <label class="view-option" title="Show only .md, .markdown and .txt files"><input type="checkbox" id="opt-docs-only"> Only .md / .txt</label>
            </div>
            <div class="file-list" id="file-list">
                <div class="empty-state">
                    <p>Nothing tracked yet.</p>
                    <p>Paste a path above, or run</p>
                    <code>livemd add file.md</code>
                </div>
            </div>
            <div id="clear-bar" class="clear-bar is-hidden">
                <button class="button clear-all-btn" id="clear-all-btn" title="Remove every watched file and followed folder">Clear all</button>
            </div>
        </div>
        <div class="tab-content is-hidden" id="inbox-tab">
            <div class="inbox-bar">
                <button class="inbox-path" id="inbox-path" title="Copy the inbox path"></button>
                <select class="select" id="inbox-sort" title="Sort order" aria-label="Sort order">
                    <option value="name">Name</option>
                    <option value="newest">Newest first</option>
                </select>
            </div>
            <div class="file-list" id="inbox-list">
                <div class="empty-state">
                    <p>Connecting…</p>
                </div>
            </div>
        </div>
        <div class="tab-content is-hidden" id="logs-tab">
            <div class="log-list" id="log-list">
                <div class="empty-state">
                    <p>No logs yet</p>
                </div>
            </div>
        </div>
        <div class="tab-content is-hidden" id="changelog-tab">
            <div class="changelog-list" id="changelog-list">
                <div class="empty-state">
                    <p>Loading changelog...</p>
                </div>
            </div>
        </div>
        <div class="sidebar-footer">
            <div id="update-banner" class="update-banner is-hidden">
                <span id="update-text"></span>
            </div>
            <div class="version-bar">
                <span id="version-label">livemd</span>
                <button class="button" id="check-update-btn" title="Check for updates">Check updates</button>
            </div>
        </div>
    </aside>
    <div class="sidebar-resizer" id="sidebar-resizer"></div>
    <main>
        <div class="content-header" id="content-header">
            <button class="icon-btn sidebar-show-btn" id="sidebar-show-btn" title="Show sidebar (Ctrl+B)" aria-label="Show sidebar">
                <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><line x1="9" y1="4" x2="9" y2="20"/><polyline points="14 10 16 12 14 14"/></svg>
            </button>
            <span class="content-header-filename" id="content-header-filename">No file selected</span>
            <span class="content-header-path" id="content-header-path"></span>
            <span class="content-header-changed" id="content-header-changed"></span>
            <button class="track-btn is-hidden" id="track-btn" title="Add this file to the watch list so it reloads as you edit it">Track</button>
            <div class="segmented is-hidden" id="view-toggle">
                <button class="segmented-btn" id="view-preview-btn" title="Show the rendered document">Preview</button>
                <button class="segmented-btn" id="view-raw-btn" title="Show the original source">Raw</button>
            </div>
            <div class="segmented is-hidden" id="width-toggle">
                <button class="segmented-btn" id="width-normal-btn" title="Hold the document to a comfortable reading column">Normal</button>
                <button class="segmented-btn" id="width-wide-btn" title="Let the document fill the window">Wide</button>
            </div>
        </div>
        <div class="content-subheader is-hidden" id="content-subheader">
            <span id="line-info"></span>
            <span class="subheader-spacer"></span>
            <button class="copy-btn" id="copy-btn" title="Copy the whole file to clipboard">Copy</button>
        </div>
        <article class="content" id="content">
        </article>
    </main>
    <div class="modal-backdrop is-hidden" id="confirm-dialog">
        <div class="modal" role="alertdialog" aria-modal="true" aria-labelledby="confirm-title" aria-describedby="confirm-body">
            <h2 class="modal-title" id="confirm-title"></h2>
            <p class="modal-body" id="confirm-body"></p>
            <div class="modal-actions">
                <button class="button" id="confirm-cancel">Cancel</button>
                <button class="button is-danger-solid" id="confirm-ok"></button>
            </div>
        </div>
    </div>
    <script src="/static/client.js"></script>
</body>
</html>
