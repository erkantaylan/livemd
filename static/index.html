<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LiveMD</title>
    <!-- No CSS framework: static/style.css is the whole design (see design.md).
         devicon supplies the per-language file icons in the tree. -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/devicon.min.css">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <!-- One toggle, pinned to the top-left corner, for both states: hiding the
         sidebar must not move the control that brings it back. -->
    <button class="icon-btn sidebar-toggle" id="sidebar-toggle" title="Hide sidebar (Ctrl+B)" aria-label="Hide sidebar" aria-expanded="true">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><line x1="9" y1="4" x2="9" y2="20"/><polyline class="sidebar-toggle-chevron" points="16 10 14 12 16 14"/></svg>
    </button>
    <aside class="sidebar">
        <div class="sidebar-header">
            <span class="logo">LiveMD</span>
            <div class="header-right">
                <span class="conn-status" id="status" role="status" title="Connecting…" aria-label="Connecting"><span class="conn-text"></span></span>
            </div>
        </div>
        <div class="sidebar-tabs">
            <ul>
                <li class="is-active" data-tab="files"><a>Files</a></li>
                <li data-tab="inbox"><a title="Files dropped into the inbox folder">Inbox<span class="tab-count is-hidden" id="inbox-count"></span></a></li>
                <li data-tab="logs"><a>Logs</a></li>
                <li data-tab="changelog"><a>Changelog</a></li>
            </ul>
        </div>
        <div class="tab-content" id="files-tab">
            <!-- One field for both jobs. Typing filters the tree; something that
                 is plainly an absolute path (/…, ~/…, C:\…) offers to track it
                 instead. See design.md, "The omnibox". -->
            <div class="omnibox" id="omnibox">
                <label class="omnibox-field">
                    <svg class="omnibox-icon icon-search" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><line x1="16.5" y1="16.5" x2="21" y2="21"/></svg>
                    <svg class="omnibox-icon icon-track" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                    <input class="omnibox-input" id="filter-input" placeholder="Filter, or paste a path to track" spellcheck="false" autocomplete="off" aria-label="Filter files, or paste a path to track" title="Type to filter — ↑↓ to move, Enter to open, Esc to clear. Paste an absolute path to track it.">
                    <kbd class="omnibox-kbd" title="Press / anywhere to jump here">/</kbd>
                    <button class="omnibox-clear" id="omnibox-clear" title="Clear (Esc)" aria-label="Clear">
                        <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/></svg>
                    </button>
                </label>
                <button class="omnibox-track is-hidden" id="add-path-btn" title="Track this path — a folder is followed with everything in it">
                    <span class="omnibox-track-label">Track</span>
                    <span class="omnibox-track-path" id="omnibox-track-path"></span>
                    <kbd class="omnibox-kbd">↵</kbd>
                </button>
                <div class="add-path-error is-hidden" id="add-path-error"></div>
                <div class="omnibox-meta">
                    <button class="chip" id="opt-gitignore" aria-pressed="true" title="Hide files git ignores. Folders followed while this is off pick them up too.">
                        <svg class="chip-check" viewBox="0 0 24 24" width="11" height="11" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="5 12 10 17 19 7"/></svg>Hide gitignored
                    </button>
                    <button class="chip" id="opt-docs-only" aria-pressed="false" title="Show only .md, .markdown and .txt files">
                        <svg class="chip-check" viewBox="0 0 24 24" width="11" height="11" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="5 12 10 17 19 7"/></svg>Docs only
                    </button>
                    <span class="filter-count" id="filter-count"></span>
                </div>
            </div>
            <div id="deleted-bar" class="deleted-bar is-hidden">
                <span id="deleted-text"></span>
                <button class="link-btn is-danger" id="remove-deleted-btn" title="Drop them from the list">Remove</button>
            </div>
            <div class="file-list" id="file-list">
                <div class="empty-state">
                    <p>Nothing tracked yet.</p>
                    <p>Paste a path above, or run</p>
                    <code>livemd add file.md</code>
                </div>
            </div>
            <div id="clear-bar" class="list-footer is-hidden">
                <span class="list-summary" id="list-summary"></span>
                <button class="link-btn is-quiet" id="clear-all-btn" title="Stop tracking every file and folder — nothing is deleted from disk">Clear list…</button>
            </div>
        </div>
        <div class="tab-content is-hidden" id="inbox-tab">
            <div class="inbox-bar">
                <button class="inbox-path" id="inbox-path" title="Copy the inbox path"></button>
                <select class="select" id="inbox-sort" title="Sort order" aria-label="Sort order">
                    <option value="name">Name</option>
                    <option value="newest">Newest first</option>
                </select>
            </div>
            <div class="file-list" id="inbox-list">
                <div class="empty-state">
                    <p>Connecting…</p>
                </div>
            </div>
        </div>
        <div class="tab-content is-hidden" id="logs-tab">
            <div class="log-list" id="log-list">
                <div class="empty-state">
                    <p>No logs yet</p>
                </div>
            </div>
        </div>
        <div class="tab-content is-hidden" id="changelog-tab">
            <div class="changelog-list" id="changelog-list">
                <div class="empty-state">
                    <p>Loading changelog...</p>
                </div>
            </div>
        </div>
        <div class="sidebar-footer">
            <div class="update-panel is-hidden" id="update-panel" role="region" aria-label="Update available">
                <p class="update-panel-title"><span id="update-version"></span> is out</p>
                <p class="update-panel-text">Update from a terminal — livemd restarts by itself:</p>
                <div class="update-cmd">
                    <code>livemd install</code>
                    <button class="link-btn" id="update-copy-btn">Copy</button>
                </div>
                <div class="update-panel-actions">
                    <button class="link-btn" id="update-notes-btn">What’s new</button>
                    <button class="link-btn is-quiet" id="update-later-btn">Later</button>
                </div>
            </div>
            <div class="version-bar">
                <a class="version-label" id="version-label" href="https://github.com/erkantaylan/livemd" target="_blank" rel="noopener"></a>
                <button class="version-status is-hidden" id="check-update-btn" data-state="checking">
                    <svg class="status-icon icon-up" viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="6 11 12 5 18 11"/></svg>
                    <span id="update-status-text">Checking…</span>
                </button>
            </div>
        </div>
    </aside>
    <div class="sidebar-resizer" id="sidebar-resizer"></div>
    <main>
        <div class="content-header" id="content-header">
            <span class="content-header-filename" id="content-header-filename">No file selected</span>
            <span class="content-header-path" id="content-header-path"></span>
            <span class="content-header-changed" id="content-header-changed"></span>
            <button class="track-btn is-hidden" id="track-btn" title="Add this file to the watch list so it reloads as you edit it">Track</button>
            <!-- Normal/Wide before Preview/Raw: Raw hides Normal/Wide (a source view
                 has no measure to widen), and with Preview/Raw last it stays pinned
                 to the right edge instead of jumping under the cursor. -->
            <div class="segmented is-hidden" id="width-toggle">
                <button class="segmented-btn" id="width-normal-btn" title="Hold the document to a comfortable reading column">Normal</button>
                <button class="segmented-btn" id="width-wide-btn" title="Let the document fill the window">Wide</button>
            </div>
            <div class="segmented is-hidden" id="view-toggle">
                <button class="segmented-btn" id="view-preview-btn" title="Show the rendered document">Preview</button>
                <button class="segmented-btn" id="view-raw-btn" title="Show the original source">Raw</button>
            </div>
        </div>
        <div class="content-subheader is-hidden" id="content-subheader">
            <span id="line-info"></span>
            <span class="subheader-spacer"></span>
            <span class="readonly-lock is-hidden" id="readonly-lock" role="img" aria-label="Read-only" title="This file is read-only: livemd cannot change it, so its checkboxes are locked"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg></span>
            <button class="copy-btn" id="copy-btn" title="Copy the whole file to clipboard">Copy</button>
        </div>
        <article class="content" id="content">
        </article>
    </main>
    <div class="modal-backdrop is-hidden" id="confirm-dialog">
        <div class="modal" role="alertdialog" aria-modal="true" aria-labelledby="confirm-title" aria-describedby="confirm-body">
            <h2 class="modal-title" id="confirm-title"></h2>
            <p class="modal-body" id="confirm-body"></p>
            <div class="modal-actions">
                <button class="button" id="confirm-cancel">Cancel</button>
                <button class="button is-danger-solid" id="confirm-ok"></button>
            </div>
        </div>
    </div>
    <script src="/static/client.js"></script>
</body>
</html>
